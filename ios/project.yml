# XcodeGen project: run `xcodegen generate` in this folder to create JumpShot.xcodeproj
name: JumpShot
options:
  bundleIdPrefix: com.igal
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JumpShot:
    type: application
    platform: iOS
    sources: [JumpShot]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.igal.jumpshot
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JumpShot
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSCameraUsageDescription: JumpShot uses the camera to detect jumps and take burst photos.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: JumpShot saves your burst photos to Photos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: JumpShot keeps your bursts in a JumpShot album and shows the latest one.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
